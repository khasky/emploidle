<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emploidle</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1 class="brand">Emploidle</h1>
      <p class="status" id="status">Idle</p>
      <button id="toggle" class="toggle" data-active="false">Start</button>
      <p class="hint">Closing the window hides it to the tray. Quit from the tray menu.</p>
      <p class="hint" id="version" aria-label="Application version"></p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
