<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emploidle - Preview</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="preview-page">
    <header class="preview-header">
      <h1 class="brand">Local preview</h1>
      <p id="preview-source" class="hint preview-source" role="status">Loading snapshot…</p>
      <p class="hint">Read-only text. The source stays unchanged.</p>
    </header>
    <textarea id="preview-document" aria-label="Local text preview" readonly spellcheck="false"></textarea>
    <script src="preview.js"></script>
  </body>
</html>
