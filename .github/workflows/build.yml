name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: Validate PR title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          validateSingleCommit: false

  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy
      - name: Install tooling
        run: pnpm install --frozen-lockfile
      - name: Lint workflow
        run: pnpm lint:workflow
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-commits.mjs
      - name: Check application versions
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: pnpm check:versions
      - name: Lint tooling
        run: pnpm lint
      - name: Test tooling
        run: pnpm test
      - name: Lint Rust
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test Rust
        run: cargo test --locked

  create-release:
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --draft --verify-tag --title "${TAG#v}"               --notes "Builds are in progress. Publish this draft after all platform jobs succeed."

  build:
    needs: [check, create-release]
    if: >-
      always() && needs.check.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') && needs.create-release.result == 'success' ||
      github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            formats: nsis
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            formats: appimage,deb
          - platform: macos-latest
            target: aarch64-apple-darwin
            formats: app,dmg
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            formats: app,dmg
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libvulkan-dev libx11-xcb-dev libfontconfig-dev libfuse2
      - name: Install tooling
        run: pnpm install --frozen-lockfile
      - name: Check versions
        run: pnpm check:versions
      - name: Rust cache
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release
      - name: Test platform code
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Check signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: test -n "$TAURI_SIGNING_PRIVATE_KEY"
      - name: Build application
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Install cargo-packager
        run: cargo install cargo-packager@0.11.8 --locked
      - name: Package application
        run: cargo packager --release --target ${{ matrix.target }} --formats ${{ matrix.formats }}
      - name: Archive macOS application for the updater
        if: runner.os == 'macOS'
        run: |
          case "${{ matrix.target }}" in
            aarch64-*) architecture=aarch64 ;;
            *) architecture=x64 ;;
          esac
          tar -czf "target/packager/Emploidle_${architecture}.app.tar.gz" -C target/packager Emploidle.app
      - name: Sign packages
        env:
          CARGO_PACKAGER_SIGN_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          CARGO_PACKAGER_SIGN_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          shopt -s nullglob
          for file in target/packager/*-setup.exe target/packager/*.AppImage target/packager/*.deb target/packager/*.dmg target/packager/*.app.tar.gz; do
            cargo packager signer sign "$file"
          done
      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          shopt -s nullglob
          gh release upload "$TAG" --clobber target/packager/*-setup.exe target/packager/*.AppImage target/packager/*.deb target/packager/*.dmg target/packager/*.app.tar.gz target/packager/*.sig
      - name: Upload manual build artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: binaries-${{ matrix.target }}
          path: |
            target/packager/*-setup.exe
            target/packager/*.AppImage
            target/packager/*.deb
            target/packager/*.dmg
            target/packager/*.app.tar.gz
            target/packager/*.sig
          if-no-files-found: error

  finalize-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install tooling
        run: pnpm install --frozen-lockfile
      - name: Rename release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: node scripts/rename-release-assets.mjs
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          node scripts/release-notes.mjs "${TAG#v}" "$RUNNER_TEMP/release-notes.md"
          gh release edit "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
